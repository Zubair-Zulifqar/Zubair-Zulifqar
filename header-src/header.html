<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --paper: #f6f4ee; --ink: #17160f; --muted: #5d5a4f; --line: #dad6ca; --line-strong: #c3beb0;
    --accent: #0f6e5d; --accent-soft: #dbeae4; --node: #ffffff;
  }
  body.dark {
    --paper: #12140f; --ink: #ecebe4; --muted: #a29f93; --line: #2a2c25; --line-strong: #3d4036;
    --accent: #4fbfa5; --accent-soft: #173229; --node: #1b1e18;
  }
  html, body { margin: 0; width: 2048px; height: 576px; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; position: relative; }
  .grid { position: absolute; inset: 0; }
  .text { position: absolute; left: 120px; top: 92px; width: 1000px; }
  .eyebrow { font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1 { font-family: "New York", "Iowan Old Style", Georgia, serif; font-weight: 500; font-size: 104px; line-height: 1; margin: 22px 0 0; letter-spacing: -0.02em; }
  .tag { font-size: 33px; line-height: 1.35; color: var(--muted); margin-top: 26px; max-width: 940px; }
  .chips { margin-top: 34px; display: flex; gap: 14px; flex-wrap: wrap; }
  .chip { font-size: 22px; padding: 9px 18px; border: 1.5px solid var(--line-strong); border-radius: 999px; color: var(--ink); }
  .chip.hl { border-color: var(--accent); color: var(--accent); }
  svg text { font-family: "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<svg class="grid" width="2048" height="576" viewBox="0 0 2048 576" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="var(--line)" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="var(--paper)" stop-opacity="1"/>
      <stop offset="0.55" stop-color="var(--paper)" stop-opacity="0.92"/>
      <stop offset="1" stop-color="var(--paper)" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="2048" height="576" fill="url(#g)"/>
  <rect width="1320" height="576" fill="url(#fade)"/>

  <!-- browser: Next.js app -->
  <g>
    <rect x="1216" y="214" width="144" height="124" rx="10" fill="var(--node)" stroke="var(--ink)" stroke-width="2"/>
    <path d="M1216 238 H1360" stroke="var(--line-strong)" stroke-width="2"/>
    <circle cx="1230" cy="226" r="4" fill="var(--line-strong)"/><circle cx="1244" cy="226" r="4" fill="var(--line-strong)"/><circle cx="1258" cy="226" r="4" fill="var(--line-strong)"/>
    <rect x="1230" y="252" width="72" height="10" rx="3" fill="var(--accent)"/>
    <rect x="1230" y="272" width="116" height="8" rx="3" fill="var(--line-strong)"/>
    <rect x="1230" y="288" width="96" height="8" rx="3" fill="var(--line-strong)"/>
    <rect x="1230" y="306" width="52" height="20" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  </g>
  <text x="1232" y="364" font-size="17" fill="var(--muted)">Next.js</text>

  <!-- links -->
  <g stroke="var(--line-strong)" stroke-width="2.5" fill="none">
    <path d="M1360 276 H1400"/>
    <path d="M1496 276 H1536"/>
    <path d="M1448 302 V392"/>
    <path d="M1680 276 C1720 276 1720 164 1760 164"/>
    <path d="M1680 276 H1760"/>
    <path d="M1680 276 C1720 276 1720 388 1760 388"/>
  </g>

  <g font-size="18">
    <rect x="1400" y="250" width="96" height="52" rx="10" fill="var(--node)" stroke="var(--line-strong)" stroke-width="2"/>
    <text x="1426" y="282" fill="var(--ink)">API</text>
    <rect x="1392" y="392" width="112" height="44" rx="10" fill="var(--node)" stroke="var(--line-strong)" stroke-width="2"/>
    <text x="1408" y="420" fill="var(--muted)" font-size="16">Postgres</text>

    <rect x="1536" y="236" width="144" height="80" rx="14" fill="var(--ink)"/>
    <text x="1562" y="270" fill="var(--paper)" font-size="20">AI agent</text>
    <text x="1562" y="298" fill="var(--paper)" font-size="15" opacity="0.7">LLM + tools</text>

    <rect x="1760" y="138" width="176" height="52" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>
    <text x="1780" y="170" fill="var(--accent)">RAG · cited</text>
    <rect x="1760" y="250" width="176" height="52" rx="10" fill="var(--node)" stroke="var(--line-strong)" stroke-width="2"/>
    <text x="1780" y="282" fill="var(--ink)">CRM · HubSpot</text>
    <rect x="1760" y="362" width="176" height="52" rx="10" fill="var(--node)" stroke="var(--line-strong)" stroke-width="2"/>
    <text x="1780" y="394" fill="var(--ink)">Stripe · APIs</text>
  </g>
  <text x="1216" y="510" font-size="17" fill="var(--muted)">React UI → Node API → data → AI layer → integrations</text>
</svg>

<div class="text">
  <div class="eyebrow">Full-Stack Developer · AI Solutions · Remote</div>
  <h1>Zubair Zulifqar</h1>
  <div class="tag">I take AI-native products from concept to production for founders and funded teams: React and Next.js front ends, Node.js back ends, and the AI layer on top.</div>
  <div class="chips">
    <span class="chip hl">React</span><span class="chip hl">Next.js</span><span class="chip hl">Node.js</span><span class="chip">AI agents</span><span class="chip">RAG</span><span class="chip">Automation</span>
  </div>
</div>
<script>if (location.hash === '#dark') document.body.classList.add('dark');</script>
</body>
</html>
